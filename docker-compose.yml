services:
  # ==========================================
  # ✅ Backend Service (FastAPI + Python)
  # ==========================================
  backend:
    build:
      context: ./backend       # ✅ ชี้ไปที่โฟลเดอร์ backend โดยตรง
      dockerfile: Dockerfile   # ✅ ใช้ Dockerfile ที่อยู่ในโฟลเดอร์ backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app         # ✅ Hot Reload: แก้โค้ดในเครื่อง → สะท้อนเข้า Container ทันที
      - ./uploads:/app/uploads # ✅ เก็บไฟล์ PDF ที่อัปโหลด (คงไว้เหมือนเดิม)
    restart: unless-stopped

  # ==========================================
  # ✅ Frontend Service (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  # ==========================================
  # ✅ Database Service (PostgreSQL 16)
  # ==========================================
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5433:5432"            # ✅ Map port 5433 (host) → 5432 (container)
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # ✅ pgAdmin (Database Management UI)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    depends_on:
      - db
    ports:
      - "5051:80"
    restart: unless-stopped

# ==========================================
# ✅ Named Volumes
# ==========================================
volumes:
  pgdata:                      # ✅ Persistent storage สำหรับ PostgreSQL